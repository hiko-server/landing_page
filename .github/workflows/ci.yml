name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs when a new commit lands on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: typecheck + lint + test + build + perf budget
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      # Yarn — yarn.lock is the source of truth.
      - name: Install
        run: yarn install --frozen-lockfile

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: yarn lint --max-warnings 0

      - name: Unit tests
        run: yarn test

      # Build needs the env vars the renderer reads at compile time. None
      # of these are secrets in the build sense — they're public site
      # identifiers. The real secrets are injected at runtime via the
      # hosting platform's env, not baked into the static bundle.
      - name: Build
        env:
          JWT_SECRET: ci-build-placeholder-do-not-use-in-prod-32chars
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASS: ci-placeholder-not-real
          NEXT_PUBLIC_PRODUCT_NAME: PortfolioStudio
          NEXT_PUBLIC_SITE_HOST: example.com
        run: yarn build

      # Shared first-load JS, per-page JS, shared CSS and preloaded fonts
      # against the thresholds in scripts/perf-budget.mjs.
      - name: Performance budget
        run: node scripts/perf-budget.mjs

  audit:
    name: dependency audit (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile --ignore-scripts

      # Fails on any high/critical advisory in production dependencies that
      # is not allowlisted (with a reason and an expiry) in
      # security/audit-allowlist.json, and on expired allowlist entries.
      - name: Audit production dependencies
        run: node scripts/check-audit.mjs --report audit-report.json

      - name: Keep the full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
          if-no-files-found: ignore
          retention-days: 30

  docker:
    name: docker image smoke + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The container bootstraps its admin account from these; the admin E2E
      # specs sign in with the same values. CI-only placeholders, not secrets.
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASS: ci-e2e-placeholder-not-a-secret
      DOCKER_BUILDKIT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The production host merges docker-compose.override.yml (a copy of the
      # example) over the base file: whatever the merge publishes must be bound
      # to loopback only, with the site on 127.0.0.1:3002, and the runtime
      # hardening (no capabilities, no-new-privileges, a PID limit) must hold
      # after the merge.
      - name: Compose config publishes loopback only and keeps the hardening
        run: |
          set -eu
          touch .env
          docker compose -f docker-compose.yml config --format json > "$RUNNER_TEMP/base.json"
          docker compose -f docker-compose.yml -f docker-compose.override.example.yml config --format json > "$RUNNER_TEMP/merged.json"
          for f in base merged; do
            jq -e '[.services[].ports[]?] | length > 0 and all(.host_ip == "127.0.0.1")' "$RUNNER_TEMP/$f.json"
          done
          jq -e '[.services[].ports[]?] | length == 1' "$RUNNER_TEMP/merged.json"
          jq -e '[.services[].ports[]? | select((.published | tostring) == "3002" and .target == 3000)] | length == 1' "$RUNNER_TEMP/merged.json"
          jq -e '.services["landing-page"].logging.driver == "local"' "$RUNNER_TEMP/merged.json"
          # Earlier builds' assets survive a deploy (scripts/static-archive.mjs).
          for f in base merged; do
            jq -e '[.services["landing-page"].volumes[] | select(.target == "/app/next-static-archive" and .type == "volume")] | length == 1' "$RUNNER_TEMP/$f.json"
          done
          for f in base merged; do
            jq -e '.services["landing-page"] | (.cap_drop == ["ALL"]) and ((.security_opt // []) | index("no-new-privileges:true") != null) and (.pids_limit > 0 and .pids_limit <= 512)' "$RUNNER_TEMP/$f.json"
          done
          rm .env

      # Same build the server runs (scripts/deploy.sh → docker compose build):
      # no data/content.db in the context, public identifiers as build args.
      - name: Build image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SITE_HOST=example.com \
            --build-arg NEXT_PUBLIC_PRODUCT_NAME=PortfolioStudio \
            --build-arg NEXT_PUBLIC_BUILD_SHA="${GITHUB_SHA::7}" \
            -t landing-page:ci .
          docker image ls landing-page:ci

      # Fresh bind-mounted data + uploads dirs and no R2 env, laid out like a
      # new server (docker-compose.override.example.yml mounts the checkout's
      # ./data and ./public/uploads): only the git seeds (home.json,
      # cvdata.json, the tracked uploads) and no content.db. The container
      # must start, build content.db from those seeds and serve — under the
      # same runtime restrictions as docker-compose.yml (no capabilities,
      # no-new-privileges, PID limit).
      - name: Start container (fresh volumes with the git seeds, no R2)
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/uploads"
          cp data/home.json data/cvdata.json "$RUNNER_TEMP/data/"
          git ls-files -z public/uploads | xargs -0 -I{} cp {} "$RUNNER_TEMP/uploads/"
          chmod 0777 "$RUNNER_TEMP/data" "$RUNNER_TEMP/uploads"
          chmod 0666 "$RUNNER_TEMP"/data/*.json "$RUNNER_TEMP"/uploads/*
          docker run -d --name lp -p 127.0.0.1:3000:3000 \
            --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 256 \
            -e NODE_ENV=production \
            -e JWT_SECRET=ci-smoke-placeholder-not-a-real-secret-32chars \
            -e ADMIN_EMAIL \
            -e ADMIN_PASS \
            -e SITE_URL=http://127.0.0.1:3000 \
            -v "$RUNNER_TEMP/data:/app/data" \
            -v "$RUNNER_TEMP/uploads:/app/public/uploads" \
            landing-page:ci

      - name: Smoke test
        run: |
          set -eu
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/api/health; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' lp)" != "true" ]; then
              echo "container exited"; exit 1
            fi
            sleep 2
          done
          echo "health: $(curl -fsS http://127.0.0.1:3000/api/health)"
          for path in /api/health /blog /work /now /uses; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$path")
            echo "$path → $code"
            test "$code" = 200
          done
          # warm-isr must find /app/.next/prerender-manifest.json and refresh the
          # build-time pages once the server is healthy.
          for i in $(seq 1 30); do
            if docker logs lp 2>&1 | grep -q '\[warm-isr\] regenerated'; then break; fi
            sleep 2
          done
          docker logs lp 2>&1 | grep '\[warm-isr\] regenerated'
          # Runs as the image's non-root user and could write the mounted data dir.
          test "$(docker exec lp id -u)" = 1001
          # …with no capabilities and no way to gain any.
          docker exec lp sh -c 'grep -E "^Cap(Eff|Bnd):" /proc/1/status'
          test "$(docker exec lp sh -c 'grep "^CapBnd:" /proc/self/status | tr -d "[:space:]" | cut -d: -f2')" = 0000000000000000
          test "$(docker exec lp sh -c 'grep "^NoNewPrivs:" /proc/self/status | tr -d "[:space:]" | cut -d: -f2')" = 1
          test -f "$RUNNER_TEMP/data/content.db"
          # The image optimizer is disabled (GHSA-2xp9-vwfh-vxw4): 404, never a resize.
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/_next/image?url=%2Ffavicon.ico&w=64&q=75')" = 404

      - name: Setup Node (E2E runner)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install E2E dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      # Public pages in four Chromium projects (desktop, tablet, phone,
      # reduced motion), on WebKit (iPhone) and Firefox, plus the admin and
      # contact flows, all against the exact image above.
      - name: E2E (Playwright + axe)
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: |
          npx playwright install --with-deps chromium webkit firefox
          yarn e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      # dumb-init must forward SIGTERM to the server: stopping has to finish
      # well before docker's 10 s SIGKILL fallback.
      - name: Graceful stop
        run: |
          start=$(date +%s)
          docker stop -t 10 lp
          elapsed=$(( $(date +%s) - start ))
          echo "stopped in ${elapsed}s"
          test "$elapsed" -lt 8

      - name: Container logs
        if: always()
        run: docker logs lp || true

  # Performance, layout, cross-engine and visual gates on realistic content:
  # the synthetic fixture store (e2e/fixtures/store — "Example Person",
  # generated images; never the live store) installed into this checkout,
  # built and served, then checked in the pinned Playwright image. The
  # visual baselines (e2e/visual.spec.ts-snapshots) are made in this same
  # image on linux/arm64, hence the Arm runner: pixels are compared on the
  # platform they were drawn on.
  fixture-gates:
    name: fixture store gates (CLS / TBT, layout, images, cross-engine, visual)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      # Firefox refuses a HOME owned by another user (the container runs as root).
      HOME: /root
      TZ: UTC
      NEXT_TELEMETRY_DISABLED: '1'
      # The fixture's absolute links name a placeholder host (visible in the baselines).
      NEXT_PUBLIC_SITE_HOST: example.com
      E2E_FIXTURE: '1'
      E2E_BASE_URL: http://127.0.0.1:3100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: |
          corepack enable
          yarn install --frozen-lockfile

      # Replaces this checkout's git seeds with the fixture (CI workspace only).
      - name: Install the fixture store
        run: node --import ./tests/register.mjs scripts/ci/fixture-store.mjs

      - name: Build
        run: yarn build

      - name: Start the fixture site
        env:
          JWT_SECRET: ci-fixture-placeholder-not-a-real-secret-32chars
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASS: ci-fixture-placeholder-not-a-secret
          NODE_ENV: production
        run: |
          nohup npx next start -p 3100 > "$RUNNER_TEMP/next.log" 2>&1 &
          for i in $(seq 1 60); do
            if node -e "fetch('http://127.0.0.1:3100/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/next.log"
          exit 1

      # Alone (one worker): parallel tests would steal the CPU it measures.
      - name: Core Web Vitals gate
        run: npx playwright test -c e2e/playwright.config.ts --project=chromium e2e/gates.spec.ts --grep @cwv --workers=1

      - name: Layout, image, cross-engine and visual gates
        run: npx playwright test -c e2e/playwright.config.ts --project=chromium --project=webkit --project=firefox --project=visual e2e/gates.spec.ts e2e/visual.spec.ts e2e/perf.spec.ts --grep-invert @cwv

      - name: Upload Playwright report (includes visual diffs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-gates-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
