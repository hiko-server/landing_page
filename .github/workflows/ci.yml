name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs when a new commit lands on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      # Yarn — project uses yarn.lock as the source of truth. (The previous
      # `npm ci` invocation here was a no-op at best and broke every push
      # at worst because it tried to read a non-existent package-lock.json.)
      - name: Install
        run: yarn install --frozen-lockfile

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: yarn lint --max-warnings 0

      - name: Unit tests
        run: yarn test

      # Build needs the env vars the renderer reads at compile time. None
      # of these are secrets in the build sense — they're public site
      # identifiers. The real secrets are injected at runtime via the
      # hosting platform's env, not baked into the static bundle.
      - name: Build
        env:
          JWT_SECRET: ci-build-placeholder-do-not-use-in-prod-32chars
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASS: ci-placeholder-not-real
          NEXT_PUBLIC_PRODUCT_NAME: PortfolioStudio
          NEXT_PUBLIC_SITE_HOST: example.com
        run: yarn build

  audit:
    name: dependency audit (advisory only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Soft-fail: known-issues we accept (e.g. transitive devDeps with no
    # patched version) shouldn't block PRs, but the report shows up in
    # the Actions log for review.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - name: Yarn audit (high+ severity only)
        run: yarn audit --level high

  docker:
    name: docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same build the server runs (`docker compose up -d --build`): no
      # data/content.db in the context, public identifiers as build args.
      - name: Build image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SITE_HOST=example.com \
            --build-arg NEXT_PUBLIC_PRODUCT_NAME=PortfolioStudio \
            -t landing-page:ci .

      # Fresh, EMPTY bind-mounted data + uploads dirs and no R2 env: the
      # container must start, seed itself from the bundled files and serve.
      - name: Start container (empty data volume, no R2)
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/uploads"
          chmod 0777 "$RUNNER_TEMP/data" "$RUNNER_TEMP/uploads"
          docker run -d --name lp -p 127.0.0.1:3000:3000 \
            -e NODE_ENV=production \
            -e JWT_SECRET=ci-smoke-placeholder-not-a-real-secret-32chars \
            -e ADMIN_EMAIL=ci@example.com \
            -e ADMIN_PASS=ci-placeholder-not-real \
            -e SITE_URL=http://127.0.0.1:3000 \
            -v "$RUNNER_TEMP/data:/app/data" \
            -v "$RUNNER_TEMP/uploads:/app/public/uploads" \
            landing-page:ci

      - name: Smoke test
        run: |
          set -eu
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/api/health; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' lp)" != "true" ]; then
              echo "container exited"; exit 1
            fi
            sleep 2
          done
          echo "health: $(curl -fsS http://127.0.0.1:3000/api/health)"
          for path in /api/health /blog /work /now /uses; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$path")
            echo "$path → $code"
            test "$code" = 200
          done
          # warm-isr must find /app/.next/prerender-manifest.json and refresh the
          # build-time pages once the server is healthy.
          for i in $(seq 1 30); do
            if docker logs lp 2>&1 | grep -q '\[warm-isr\] regenerated'; then break; fi
            sleep 2
          done
          docker logs lp 2>&1 | grep '\[warm-isr\] regenerated'
          # Runs as the image's non-root user and could write the mounted data dir.
          test "$(docker exec lp id -u)" = 1001
          test -f "$RUNNER_TEMP/data/content.db"

      # dumb-init must forward SIGTERM to the server: stopping has to finish
      # well before docker's 10 s SIGKILL fallback.
      - name: Graceful stop
        run: |
          start=$(date +%s)
          docker stop -t 10 lp
          elapsed=$(( $(date +%s) - start ))
          echo "stopped in ${elapsed}s"
          test "$elapsed" -lt 8

      - name: Container logs
        if: always()
        run: docker logs lp || true
