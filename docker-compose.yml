
services:
  landing-page:
    image: hiko-landing-page-frontend-ts-staging:latest
    container_name: hiko-landing-page-frontend-ts-staging
    build:
      context: .
      dockerfile: ./Dockerfile
      # Public (non-secret) values baked into the client bundle at build time.
      args:
        NEXT_PUBLIC_SITE_HOST: ${NEXT_PUBLIC_SITE_HOST:-}
        NEXT_PUBLIC_PRODUCT_NAME: ${NEXT_PUBLIC_PRODUCT_NAME:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    env_file:
      - .env
    # unless-stopped survives daemon restarts and clean exits (on-failure does
    # not); the caps stop a runaway from starving co-located containers. The app
    # idles ~150MB, so 1g is generous headroom, not a tight leash.
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    # Persistent runtime state. Without these, every rebuild/redeploy wiped
    # data/admin.json (password changes), version-history snapshots, local
    # backups, the contact fallback inbox and uploaded images. Named volumes
    # inherit the image's nextjs ownership on first use and survive
    # `docker compose down` (only `down -v` removes them).
    volumes:
      - landing-data:/app/data
      - landing-uploads:/app/public/uploads
    # Loopback only: the site is reached through a reverse proxy / Cloudflare
    # Tunnel on the host, never directly. (The server's override replaces this
    # mapping with its own loopback port; the named volumes above are likewise
    # shadowed there by bind mounts on the same targets.)
    ports:
      - "127.0.0.1:8000:3000"
    networks:
      easilycv:
        ipv4_address: 172.18.0.9
  # reverse-proxy:
