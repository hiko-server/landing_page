services:
  landing-page:
    image: hiko-landing-page-frontend-ts-staging:latest
    container_name: hiko-landing-page-frontend-ts-staging
    build:
      context: .
      dockerfile: ./Dockerfile
      # Public (non-secret) values baked into the client bundle at build time.
      args:
        NEXT_PUBLIC_SITE_HOST: ${NEXT_PUBLIC_SITE_HOST:-}
        NEXT_PUBLIC_PRODUCT_NAME: ${NEXT_PUBLIC_PRODUCT_NAME:-}
        # Theme for visitors without a preference: empty = dark, or light / system.
        NEXT_PUBLIC_DEFAULT_THEME: ${NEXT_PUBLIC_DEFAULT_THEME:-}
        # Short commit of the deployed tree, shown on /colophon. scripts/deploy.sh
        # exports it; a plain `docker compose build` leaves it empty.
        NEXT_PUBLIC_BUILD_SHA: ${NEXT_PUBLIC_BUILD_SHA:-}
    env_file:
      - .env
    # unless-stopped survives daemon restarts and clean exits (on-failure does
    # not); the caps stop a runaway from starving co-located containers. The app
    # idles ~150MB, so 1g is generous headroom, not a tight leash.
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    # Runtime hardening (OWASP Docker cheat sheet). The server runs as the
    # image's non-root user on port 3000 and the entrypoint does no chown /
    # setcap, so it needs no Linux capability at all; no process may gain
    # privileges through setuid binaries; and the process/thread count is
    # bounded (Node, libuv's pool, sharp's workers, the boot sync and the ISR
    # warm-up stay well under 100) so a runaway cannot exhaust the PIDs of a
    # host shared with other containers. CI starts the image with the same
    # three restrictions for the E2E run and asserts them on the merged config.
    # The root file system stays writable: ISR rewrites prerendered pages
    # under /app/.next/server, which a read-only image would need to move to
    # a volume that is re-seeded on every deploy (see the README, Docker).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    # Rotated container logs: the default json-file driver grows without bound.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    # Persistent runtime state. Without these, every rebuild/redeploy wiped
    # data/admin.json (password changes), version-history snapshots, local
    # backups, the contact fallback inbox and uploaded images. Named volumes
    # inherit the image's nextjs ownership on first use and survive
    # `docker compose down` (only `down -v` removes them).
    # landing-static-archive keeps the browser assets of the builds deployed
    # in the last week (scripts/static-archive.mjs), so a page loaded before a
    # deploy still finds its scripts. Not personal data; safe to delete.
    volumes:
      - landing-data:/app/data
      - landing-uploads:/app/public/uploads
      - landing-static-archive:/app/next-static-archive
    # Loopback only: the site is reached through a reverse proxy / Cloudflare
    # Tunnel on the host, never directly. (The server's override — see
    # docker-compose.override.example.yml — replaces this mapping with its own
    # loopback port; the named volumes above are likewise shadowed there by
    # bind mounts on the same targets.)
    ports:
      - "127.0.0.1:8000:3000"
    networks:
      easilycv:
        ipv4_address: 172.18.0.9

volumes:
  landing-data:
  landing-uploads:
  landing-static-archive:

networks:
  easilycv:
    name: easilycv
    external: true
